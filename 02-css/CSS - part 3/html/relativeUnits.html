<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relative Units in CSS</title>
  <link rel="stylesheet" href="../relativeUnits.css">
</head>

<body>
  <h1>Relative Units in CSS</h1>

  <!-- Percentage Units -->
  <p>Percentage Units</p>
  <div id="outer">
    <div id="inner"> </div>
  </div>
  <hr>

  <!-- Em Units -->
  <p>Em Units</p>
  <div id="outer2"> This is Outer Div
    <div id="inner2"> This is Inner Div </div>
  </div>

  <button>Click Me</button>
  <hr>

  <!--rem Units-->
  <p>Rem Units</p>
  <section class="section">
    This is a section
    <div class="div">
      This is a div inside the section
      <div class="div">
        This is a div inside the div
        <div class="div">
          This is a div inside the div inside the div
        </div>
      </div>
    </div>
  </section>
</body>

</html>
