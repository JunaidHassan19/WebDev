<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Using Bootstrap</title>
  <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <p>This is Simple button </p>
  <button>Click me</button>
  <br>
  <p>This is a button with class "btn"</p>
  <button class="btn">Click me</button>
  <br>
  <p>This is a button with class "btn btn-primary"</p>
  <button class="btn btn-primary">Click me</button>
  <br>
  <p>This is a button with class "btn btn-secondary"</p>
  <button class="btn btn-secondary">Another button</button>

</body>

</html>
