<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Simon Says Game</h1>
  <h2>Press any key to start</h2>

  <div class="tbn-container">
    <div class="line-one">
      <div class="btn red" type="button">Button 1</div>
      <div class="btn yellow" type="button">Button 2</div>
    </div>

    <div class="line-two">
      <div class="btn green" type="button">Button 3</div>
      <div class="btn purple" type="button">Button 4</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
