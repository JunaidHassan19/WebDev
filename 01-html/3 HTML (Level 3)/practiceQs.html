<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Qs</title>
</head>

<body>
  <table border=black>
    <caption>A test table with merged cells</caption>

    <thead>
      <tr>
        <th rowspan="2"></th>
        <th colspan="2">Average</th>
        <th rowspan="2">Red eyes</th>
      </tr>

      <tr>
        <th>Height</th>
        <th>Weight</th>
      </tr>

    </thead>

    <tbody>
      <tr>
        <td>Males</td>
        <td>1.9</td>
        <td>0.003</td>
        <td>40%</td>
      </tr>

      <tr>
        <td>Females</td>
        <td>1.7</td>
        <td>0.002</td>
        <td>43%</td>
      </tr>
    </tbody>
  </table>

  <p>Practice for name attribute</p>
  <form action="https://www.google.com/search">
    <input type="text" name="q" placeholder="Google.com">
    <button>submit</button>
  </form>


  <p>Practice for form attribute</p>


  <form action="/action">
    <caption>
      <h1>Registration Form</h1>
    </caption>

    <label for="fname" />
    <input type="text" name="fname" id="fname" placeholder="First Name">
    <label for="lname" />
    <input type="text" name="lname" id="lname" placeholder="Last Name">
    <br>
    <label for="gender">Pleasr select gender</label>
    <select name="male" id="gender">
      <option>Selece you gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>
    <br>

    <label for="terms">Do you agree to all terms of service?
      <input type="checkbox" name="terms" id="terms">
      Yes, I agree
    </label>
    <br>

    <button>submit</button>
  </form>
</body>

</html>
