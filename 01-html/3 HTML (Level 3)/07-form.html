<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Elements</title>
</head>

<body>
  <form action="/action">

    <div>
      <label for="username">Enter Username:</label>
      <input type="text" placeholder="Enter your username" id="username">
    </div>

    <div>
      <label for="password">Enter Password:</label>
      <input type="password" placeholder="Enter your password" id="password">
    </div>

    <div>
      <label for="date">Enter Date of Birth:</label>
      <input type="date" placeholder="Enter DOB" id="date">
    </div>

    <h3>Button Types</h3>
    <p>these are different types of buttons: </p>
    <p>submit the form</p>
    <button>Submit</button>
    <button type="submit">Submit2</button> <!-- submits the form -->
    <br>
    <p>does not submit the form</p>
    <button type="button">no action</button> <!-- does not submit the form -->
    <br>
    <p>resets the form fields to their initial values</p>
    <button type="reset">Reset</button> <!-- resets the form fields to their initial values -->
    <br>
    <p>buttons with input elements</p>
    <input type="submit" value="Submit3">
    <input type="reset" value="Reset2">
    <input type="button" value="no action2">

  </form>
  <p>these are different types of buttons: they do not submit the form</p>
  <button type="submit">Submit</button>
  <button>no action</button>

</body>

</html>
