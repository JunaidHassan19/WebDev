<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Attribute</title>
</head>

<body>
  <form action="/action">

    <div>
      <label for="username">Enter Username:</label>
      <input type="text" placeholder="Enter your username" id="username" name="user" />
    </div>

    <div>
      <label for="password">Enter Password:</label>
      <input type="password" placeholder="Enter your password" id="password" name="pass" />
    </div>

    <button>Submit</button>
    <hr>

  </form>

  <form action="https://www.google.com/search">
    <input type="text" placeholder="Search in Google" name="q">
    <button>submit</button>
  </form>

  <form action="https://www.youtube.com/results">
    <input type="text" placeholder="Search in Youtube" name="search_query">
    <button>submit</button>
  </form>
  <hr>

</body>

</html>
