<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range- Input Element</title>
</head>

<body>
  <form action="/action">
    <label for="level">Select Range</label>
    <input type="range" min="0" max="1000" id="level" name="val" value="100" step="50">
    <button>submit</button>
  </form>
</body>

</html>
