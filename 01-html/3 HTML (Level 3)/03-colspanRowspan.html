<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colspan & Rowspan</title>
</head>

<body>
  <table border=black>
    <caption>Food Menu</caption>
    <thead>
      <tr>
        <th rowspan="2">Food</th>
        <th colspan="2">Price</th>
      </tr>

      <tr>
        <th>INR</th>
        <th>USD</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Chicken Biryani</td>
        <td>250</td>
        <td>2.63</td>
      </tr>

      <tr>
        <td>Chicken kanti</td>
        <td>150</td>
        <td>1.59</td>
      </tr>

      <tr>
        <td>Chicken Kabab</td>
        <td>300</td>
        <td>3.19</td>
      </tr>

      <tr>
        <td>Rista</td>
        <td>80</td>
        <td>0.85</td>
      </tr>
    </tbody>

  </table>
</body>

</html>
