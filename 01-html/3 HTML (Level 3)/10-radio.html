<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio - Input Element</title>
</head>

<body>
  <form action="/action">
    <label for="human">Human</label>
    <input type="radio" name="varify" id="human" value="human">

    <br>
    <label for="robot">Robot</label>
    <input type="radio" name="varify" id="robot" value="robot">

    <br>
    <label for="alien">Alien</label>
    <input type="radio" name="varify" id="alien" value="alien">
    <br>
    <button>submit</button>
  </form>

  <p>learn more about radio buttons visit <a
      href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/radio">MDN Web Docs</a></p>
</body>

</html>
