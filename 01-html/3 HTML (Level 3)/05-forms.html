<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input - Form Elements</title>
</head>

<body>
  <form action="/action">

    Username:
    <input type="text">
    <br>
    Number:
    <input type="number">
    <br>
    Password:
    <input type="password">
    <br>
    Time:
    <input type="time">
    <br>
    Color:
    <input type="color">
    <br>
    Date:
    <input type="date">

  </form>

  <p>For more information about form elements, see the <a
      href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form">MDN documentation</a>.</p>

</body>

</html>
