<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox - Input Element</title>
</head>

<body>
  <form action="/action">
    <label for="age">Are you 18+</label>
    <input type="checkbox" name="age" id="age">
    <button>submit</button>
  </form>

  <form action="/action">
    <label for="human">Human</label>
    <input type="checkbox" name="varify" id="human" value="human">
    <label for="robot">Robot</label>
    <input type="checkbox" name="varify" id="robot" value="robot">
    <label for="alien">Alien</label>
    <input type="checkbox" name="varify" id="alien" value="alien">
    <button>submit</button>
  </form>
</body>

</html>
