<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder & Label</title>
</head>

<body>
  <form action="/action">

    <div>
      <label for="username">Enter Username:</label>
      <input type="text" placeholder="Enter your username" id="username">
    </div>

    <div>
      <label for="password">Enter Password:</label>
      <input type="password" placeholder="Enter your password" id="password">
    </div>

    <div>
      <label for="date">Enter Date of Birth:</label>
      <input type="date" placeholder="Enter DOB" id="date">
    </div>

  </form>

  <p>for more information about placeholder attributes, see the <a
      href="https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/placeholder">MDN documentation</a>.</p>

  <p>for more information about label attributes, see the <a
      href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/label">MDN documentation</a>.</p>

</body>

</html>
