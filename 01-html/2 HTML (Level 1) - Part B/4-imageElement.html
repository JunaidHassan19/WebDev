<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Element</title>
</head>

<body>
  <p>Relative path to image:</p>
  <img src="Images/cat.jpg" alt="A cute cat" width="300" height="200">

  <p>Absolute path to image:</p>
  <img
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3jQEsUIDoMkUZAZLSlAmxDmYiWSJQqlrNf1KCYW9eaUdGSoEz4nN6BMtGfHeqclOnM6iP_ZH4g19bVLsgIu9pxj19VLMufamPgK5ca-wbow&s=10"
    alt="a cute cat" width="300" height="200">



  <h2>List of cats</h2>
  <ul>
    <li>Black Cat <a href="Images/black cat.jpg">see a Black cat</a></li>
    <li>Brown Cat <a href="Images/brown cat.jpg">see a Brown cat</a></li>
    <li>White Cat <a href="Images/white cat.jpg">see a White cat</a></li>
  </ul>
</body>

</html>
