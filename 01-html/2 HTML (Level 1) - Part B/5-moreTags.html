  <h1><b>Poem</b></h1>
  <p>Twinkle, twinkle, little star,<br> How I wonder what you are! <br>Up above the world so high,<br> Like a diamond in
    the sky.<br> Twinkle, twinkle, little star,<br> How I wonder what you are!</p>
  <p><i>Written by Jane Taylor</i></p>
  <u>In 1803</u>
